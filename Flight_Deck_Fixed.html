<script>
var TYPES=['Distance driver','Fairway driver','Midrange','Putter','Other'];
var discs=[],filter='All',editing=null;
var KEY='discgolf-bag-v1';
function load(){try{var r=localStorage.getItem(KEY);if(r)discs=JSON.parse(r)||[]}catch(e){discs=[]}}
function save(){
  try{
    var next=JSON.stringify(discs),prev=localStorage.getItem(KEY);
    if(prev&&prev!==next){
      var hist=[];
      try{hist=JSON.parse(localStorage.getItem(HISTKEY))||[]}catch(e){hist=[]}
      if(!Array.isArray(hist))hist=[];
      if(!hist.length||!hist[0]||hist[0].bag!==prev){
        hist.unshift({t:Date.now(),bag:prev});
        if(hist.length>8)hist.length=8;
        try{localStorage.setItem(HISTKEY,JSON.stringify(hist))}catch(e){}
      }
    }
    localStorage.setItem(KEY,next);
    sync='local';
  }catch(e){sync='error'}
  setAcct();
}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function fmt(n){return (Math.round(n*2)/2).toString()}
function verdict(d){
  var k=(d.a[2]+d.a[3])-(d.f[2]+d.f[3]);
  if(k<=-3)return['Super understable','u'];
  if(k<=-1.5)return['Understable','u'];
  if(k<=-.5)return['Slightly understable','u'];
  if(k<.5)return['Flies as stated','z'];
  if(k<1.5)return['Slightly overstable','o'];
  if(k<3)return['Overstable','o'];
  return['Beefy','o'];
}
// Card drawing uses the same normal, flat, backhand shape as the bag map.
function flightPoint(f,u,hand){
  var s=chartShape(f,'norm',false),dir=hand===undefined?1:hand,t=clamp(u,0,1);
  return [clamp(48+dir*(-chartLateral(t,s))*12,8,88),118-96*clamp(s.distance/470,.42,1)*t];
}
function smoothOpen(P){
  if(P.length<2)return '';
  var d='M'+P[0][0].toFixed(1)+' '+P[0][1].toFixed(1);
  for(var i=0;i<P.length-1;i++){
    var p0=P[Math.max(0,i-1)],p1=P[i],p2=P[i+1],p3=P[Math.min(P.length-1,i+2)];
    d+=' C'+(p1[0]+(p2[0]-p0[0])/6).toFixed(1)+' '+(p1[1]+(p2[1]-p0[1])/6).toFixed(1)+' '+(p2[0]-(p3[0]-p1[0])/6).toFixed(1)+' '+(p2[1]-(p3[1]-p1[1])/6).toFixed(1)+' '+p2[0].toFixed(1)+' '+p2[1].toFixed(1);
  }
  return d;
}
function path(f){var P=[];for(var i=0;i<=32;i++)P.push(flightPoint(f,i/32,1));return smoothOpen(P);}
function nums(a,ref){
  return '<span class="n">'+a.map(function(v,i){return '<span class="'+(ref&&ref[i]!==v?'ch':'')+'">'+fmt(v)+'</span>'}).join('')+'</span>';
}
function tbl(d){
  var L=['Speed','Glide','Turn','Fade'],h='<div></div>'+L.map(function(l){return '<div class="h">'+l+'</div>'}).join('');
  var r1='<div class="rl">Factory</div>'+d.f.map(function(v){return '<div class="c">'+fmt(v)+'</div>'}).join('');
  var r2='<div class="rl">You</div>'+d.a.map(function(v,i){return '<div class="c'+(v!==d.f[i]?' ch':'')+'">'+fmt(v)+'</div>'}).join('');
  return h+r1+r2;
}
function gauge(d){
  function pos(f){return Math.max(3,Math.min(97,((f[2]+f[3])+6)/12*100))}
  return '<div class="gauge"><div class="gt"><i class="gf" style="left:'+pos(d.f)+'%"></i><i class="ga" style="left:'+pos(d.a)+'%"></i></div><div class="gl"><span>Understable</span><span class=\"key\"><i class=\"kh\"></i>Factory <i class=\"ks\"></i>Yours</span><span>Overstable</span></div></div>';
}
function clearQ(){var e=document.getElementById('q');e.value='';render();e.focus()}
var coll={cat:false,bag:false,map:false};
function togg(k){coll[k]=!coll[k];render()}
function sech(k,l,n,inner){return '<div class="cs'+(coll[k]?' closed':'')+'"><button class="sech" onclick="tg(this,\''+k+'\')" aria-expanded="'+(!coll[k])+'"><b>'+l+' <em>'+n+'</em></b><span class="chev">▾</span></button><div class="cbody"><div class="cin">'+inner+'</div></div></div>'}
function tg(b,k){coll[k]=!coll[k];b.parentNode.classList.toggle('closed',coll[k]);b.setAttribute('aria-expanded',String(!coll[k]))}
function toast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(function(){t.classList.remove('on')},1800)}
var mapHide={},mapView='both',mapAng=0,mapFull=false,mapInit=false,mapPower=330,mapScope=[],mapFocus='',mapThrow='RHBH',mapToolsOpen=false;
try{var _mp=Number(localStorage.getItem('fd-map-power'));if(_mp>=200&&_mp<=450)mapPower=_mp;var _ma=Number(localStorage.getItem('fd-map-angle'));if(isFinite(_ma)&&localStorage.getItem('fd-map-angle')!==null)mapAng=Math.max(-30,Math.min(30,_ma));var _mt=localStorage.getItem('fd-map-throw');if(['RHBH','LHBH','RHFH','LHFH'].indexOf(_mt)>-1)mapThrow=_mt}catch(e){}
function clamp(x,a,b){return Math.max(a,Math.min(b,x))}
function mapHandDirection(){return (mapThrow==='RHBH'||mapThrow==='LHFH')?1:-1}
function setMapThrow(v){if(['RHBH','LHBH','RHFH','LHFH'].indexOf(v)<0)return;mapThrow=v;try{localStorage.setItem('fd-map-throw',v)}catch(e){}drawMap();updateMapMath()}
function armBand(power){power=Number(power)||330;return power<305?'slow':power>365?'fast':'norm'}
// Shape follows the DG Puttheads chart pattern: y is carry in feet, negative x is high-speed turn, positive x is late fade.
// Slower throws shorten the flight and finish harder. Faster throws show more turn and a softer fade.
// Forehand adds torque instead of only mirroring the backhand line. Release angle is a local extra.
function chartShape(f,band,fore){
  var speed=clamp(Number(f[0])||1,1,14),glide=clamp(Number(f[1])||1,1,7),turn=clamp(Number(f[2])||0,-5,1),fade=clamp(Number(f[3])||0,0,6);
  var T=Math.max(0,-turn),speedGate=T?clamp(1-Math.max(0,speed-5)*.085/Math.max(1,T),.18,1):1;
  var turnMag=.4*T*speedGate,fadeTravel=.44*fade;
  if(band==='slow'){turnMag=Math.max(0,turnMag-.11);fadeTravel+=.24}
  else if(band==='fast'){turnMag+=.12;fadeTravel=Math.max(0,fadeTravel-.24)}
  if(fore){turnMag+=.18;fadeTravel=Math.max(0,fadeTravel-.18)}
  var distance=clamp(190+speed*22+(glide-4)*12-Math.max(0,fade-1)*8,140,480);
  if(band==='slow')distance*=(.96-.011*Math.max(0,speed-2));
  else if(band==='fast')distance*=1.06;
  if(fore)distance*=.975;
  return {turnMag:turnMag,fadeTravel:fadeTravel,distance:distance};
}
function chartLateral(u,s){
  var turnEnv=Math.pow(clamp(u/.82,0,1),2.2),fadeEnv=Math.pow(clamp((u-.55)/.45,0,1),1.8);
  return -s.turnMag*turnEnv+s.fadeTravel*fadeEnv;
}
function flightModel(f,ang,power){
  var angle=clamp(Number(ang)||0,-30,30),power=clamp(Number(power)||mapPower,200,450);
  var s=chartShape(f,armBand(power),mapThrow.slice(2)==='FH');
  s.turnMag=Math.max(0,s.turnMag+angle/40);
  s.fadeTravel=Math.max(0,s.fadeTravel-angle/55);
  s.distance=clamp(s.distance*(1-Math.pow(Math.abs(angle)/30,1.6)*.08),60,500);
  s.angle=angle;s.power=power;
  s.angleDelta=s.distance-flightModelFlatBase(f,power);
  return s;
}
function flightModelFlatBase(f,power){return chartShape(f,armBand(power),false).distance}
function fpts(f,ang,power,mirror){
  var m=flightModel(f,ang,power),P=[],direction=mirror?-1:1;
  for(var i=0;i<=80;i++){
    var u=i/80,lateral=direction*(-chartLateral(u,m))*18;
    P.push([clamp(110+lateral,14,206),232-m.distance*.42*u]);
  }
  return P;
}
function pd(P){return P.map(function(q,i){return (i?'L':'M')+q[0].toFixed(1)+' '+q[1].toFixed(1)}).join('')}
function angLabel(v){return v===0?'Flat':Math.abs(v)+'\u00b0 '+(v<0?'hyzer':'anhyzer')}
function themeLight(){return document.documentElement.getAttribute('data-theme')!=='dark'}
function discLight(hex){
  var h=String(hex||'').replace('#','');
  if(h.length===3)h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
  if(!/^[0-9a-fA-F]{6}$/.test(h))return false;
  var n=parseInt(h,16),r=(n>>16)&255,g=(n>>8)&255,b=n&255;
  return (0.2126*r+0.7152*g+0.0722*b)/255>0.82;
}
function mapSvg(){
  var o='',vis=mapScope.filter(function(d){return !mapHide[d.id]}),focus=vis.filter(function(d){return d.id===mapFocus})[0]||vis[0];
  o+='<defs><linearGradient id="fieldwash" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="var(--card)"/><stop offset="100%" stop-color="var(--bg)"/></linearGradient></defs><rect x="0" y="0" width="220" height="300" rx="18" fill="url(#fieldwash)"/>';
  o+='<rect x="49" y="18" width="122" height="214" rx="30" fill="var(--acc)" opacity=".055"/><path d="M78 22 L64 232 M142 22 L156 232" stroke="var(--line)" stroke-dasharray="3 5" fill="none" opacity=".8"/>';
  [100,200,300,400].forEach(function(ft){var y=232-ft*.42;if(y>10&&y<232)o+='<line x1="12" y1="'+y.toFixed(1)+'" x2="208" y2="'+y.toFixed(1)+'" stroke="var(--line)" stroke-dasharray="3 5"/><text x="14" y="'+(y-4).toFixed(1)+'" font-size="7" fill="var(--mut)" font-family="system-ui,sans-serif">'+ft+' ft</text>'});
  o+='<line x1="110" y1="20" x2="110" y2="232" stroke="var(--line)" stroke-dasharray="2 5"/>';
  var ordered=vis.filter(function(d){return !focus||d.id!==focus.id});if(focus)ordered.push(focus);
  ordered.forEach(function(d){
    var col=esc(d.color||'#8b5cf6'),isFocus=focus&&d.id===focus.id,sid=esc(d.id),lite=themeLight()&&discLight(d.color||'#8b5cf6');
    var nums=mapView==='factory'?d.f:d.a,m=flightModel(nums,mapAng,mapPower),P=fpts(nums,mapAng,mapPower,mapHandDirection()<0),e=P[P.length-1];
    function rim(dstr,w,dash){return lite?'<path d="'+dstr+'" fill="none" stroke="var(--ink)" stroke-width="'+(Number(w)+2.4)+'"'+(dash?' stroke-dasharray="5 4"':'')+' stroke-linecap="round"/>':''}
    o+='<g class="fpath" role="button" tabindex="0" aria-label="Show '+esc(d.name)+' in front" aria-pressed="'+(isFocus?'true':'false')+'" onkeydown="if(event.key===\'Enter\'||event.key===\' \')setMapFocus(\''+sid+'\')"><title>'+esc(d.name)+'</title>';
    if(isFocus)o+='<path d="'+pd(P)+'" fill="none" stroke="'+(lite?'var(--ink)':'var(--card)')+'" stroke-width="8" stroke-linecap="round"/>';
    if(mapView!=='yours'){var fp=pd(fpts(d.f,mapAng,mapPower,mapHandDirection()<0)),fw=isFocus?'2.6':'1.6';o+=rim(fp,fw,true)+'<path d="'+fp+'" fill="none" stroke="'+col+'" stroke-width="'+fw+'" stroke-dasharray="5 4" stroke-linecap="round" opacity="'+(mapView==='both'?(isFocus?'.85':'.27'):(isFocus?'.95':'.35'))+'"/>';}
    if(mapView!=='factory'){var yw=isFocus?'3.8':'2';o+=rim(pd(P),yw,false)+'<path d="'+pd(P)+'" fill="none" stroke="'+col+'" stroke-width="'+yw+'" stroke-linecap="round" opacity="'+(isFocus?'1':'.42')+'"/>';}
    o+='<circle cx="'+e[0].toFixed(1)+'" cy="'+e[1].toFixed(1)+'" r="'+(isFocus?'4.8':'3')+'" fill="'+col+'" stroke="'+(lite?'var(--ink)':'var(--card)')+'" stroke-width="'+(lite?'1.8':'1.6')+'"/>';
    if(isFocus){var bx=clamp(e[0]-24,8,168),by=clamp(e[1]-22,8,260);o+='<g aria-label="Estimated landing distance"><rect x="'+bx.toFixed(1)+'" y="'+by.toFixed(1)+'" width="44" height="16" rx="7" fill="var(--acc)"/><text x="'+(bx+22).toFixed(1)+'" y="'+(by+10.8).toFixed(1)+'" text-anchor="middle" font-size="7.2" font-weight="800" fill="#fff" font-family="system-ui,sans-serif">'+Math.round(m.distance)+' ft</text></g>';}
    o+='</g>';
  });
  if(!vis.length)o+='<text x="110" y="145" text-anchor="middle" font-size="9" fill="var(--mut)" font-family="system-ui,sans-serif">Choose a disc below</text>';
  o+='<circle cx="110" cy="232" r="4" fill="var(--acc)" stroke="var(--card)" stroke-width="1.5"/><text x="110" y="246" text-anchor="middle" font-size="7" font-weight="800" fill="var(--mut)" font-family="system-ui,sans-serif">TEE / RELEASE</text>';
  return o;
}
function drawMap(){var el=document.getElementById('mapsvg');if(el)el.innerHTML=mapSvg()}
function updateMapMath(){
  var vis=mapScope.filter(function(x){return !mapHide[x.id]}),d=vis.filter(function(x){return x.id===mapFocus})[0]||vis[0];
  var focusbar=document.getElementById('mapfocusbadge');
  var tl=document.getElementById('mapthrowlabel'); if(tl) tl.textContent=mapThrow;
  if(!d){if(focusbar)focusbar.innerHTML='<b>No disc selected</b><span>Tap a disc dot</span>';syncDock();return}
  var f=mapView==='factory'?d.f:d.a;
  var rating=mapView==='factory'?'Factory':mapView==='yours'?'Yours':'Both';
  if(focusbar)focusbar.innerHTML='<span class="mapfdisc"><i style="background:'+esc(d.color||'#8b5cf6')+'"></i><span><b>'+esc(d.name)+'</b><small>'+esc(d.brand||'Custom disc')+' · '+rating+'</small></span></span><span class="mapffn">'+f.map(fmt).join(' / ')+'</span>';
  syncDock();
}
function setMapView(v){mapView=v;Array.prototype.forEach.call(document.querySelectorAll('#mseg button'),function(b){b.classList.toggle('on',b.getAttribute('data-v')===v)});drawMap();updateMapMath()}
function mapTog(id,b){mapHide[id]=!mapHide[id];b.classList.toggle('off',!!mapHide[id]);if(!mapHide[id])mapFocus=id;drawMap();updateMapMath();syncMapControls()}
function mapAll(on){mapScope.forEach(function(d){mapHide[d.id]=!on});if(on&&mapScope.length)mapFocus=mapScope[0].id;Array.prototype.forEach.call(document.querySelectorAll('.mdot'),function(b){b.classList.toggle('off',!on)});drawMap();updateMapMath();syncMapControls()}
function toggleHand(){var fh=mapThrow.slice(2)==='FH',rh=mapThrow.slice(0,2)==='RH';setMapThrow((rh?'LH':'RH')+(fh?'FH':'BH'))}
function toggleFore(){setMapThrow(mapThrow.slice(0,2)+(mapThrow.slice(2)==='FH'?'BH':'FH'))}
function setSpeedBand(k){setPower(k==='slow'?280:k==='fast'?400:330)}
function dockIco(name){return '<span class="mico" style="--ico:url(\'/icons/'+name+'.png\')"></span>'}
function handIcon(right){return dockIco(right?'lh':'rh')}
function angleIcon(deg){return dockIco(deg<0?'hyzer':deg>0?'anhyzer':'flat')}
function speedIcon(n){return dockIco(n>=3?'fast':n<=1?'slow':'neutral')}
function throwIcon(fore){return dockIco(fore?'fh':'bh')}
function syncDock(){
  var h=document.getElementById('handbtn'),f=document.getElementById('forebtn'),rh=mapThrow.slice(0,2)==='RH',fh=mapThrow.slice(2)==='FH';
  if(h){h.innerHTML=handIcon(rh);h.title=rh?'Right hand':'Left hand';h.setAttribute('aria-label',rh?'Right hand, switch to left':'Left hand, switch to right')}
  if(f){f.innerHTML=throwIcon(fh);f.title=fh?'Forehand':'Backhand';f.setAttribute('aria-label',fh?'Forehand, switch to backhand':'Backhand, switch to forehand')}
  var ang=[-12,0,12].reduce(function(b,a){return Math.abs(a-mapAng)<Math.abs(b-mapAng)?a:b;},0);
  Array.prototype.forEach.call(document.querySelectorAll('[data-ang]'),function(b){b.classList.toggle('on',+b.getAttribute('data-ang')===ang)});
  var spd=[{k:'slow',p:280},{k:'norm',p:330},{k:'fast',p:400}].reduce(function(b,a){return Math.abs(a.p-mapPower)<Math.abs(b.p-mapPower)?a:b;});

  return hist.map(function(h,i){
    var n='?',label='';
    try{var a=JSON.parse(h.bag);if(Array.isArray(a)){n=a.length;if(a[0]&&a[0].name)label=a[0].name}}catch(e){}
    return '<div class="cr"><div><div class="nm" style="font-size:15px">'+n+' disc'+(n===1?'':'s')+'</div><div class="meta">'+esc(bkWhen(h.t))+(label?' · '+esc(label):'')+'</div></div><button type="button" class="sm" onclick="bkUseHist('+i+')">Restore</button></div>';
  }).join('');
}
function openBackup(){bkDraft='';bkHome()}
function bkHome(){
  bkStopCam();
  var text=bagText(),made=bkQrSvg(text),share=navigator.share?'<button type="button" onclick="bkShare()">Share</button>':'';
  var qr=made?made.svg:'<div class="meta">This bag is too big for one code. Share the text or save a file.</div>';
  var hint=made&&made.n>117?'<div class="meta" style="text-align:center">This code is dense. If it will not scan, use Share or save a file.</div>':'';
  document.getElementById('sheet').innerHTML=
    '<h2 style="margin:0 0 6px">Backup &amp; restore</h2>'+
    '<div class="meta">Scan this code with another phone, or share it. A few earlier bags stay on this phone.</div>'+
    '<div class="bkqr" id="bkqr">'+qr+'</div>'+hint+
    '<div class="meta" style="text-align:center">'+discs.length+' disc'+(discs.length===1?'':'s')+'</div>'+
    '<label class="bkcheck"><input id="bksetup" type="checkbox" onchange="bkToggleSetup()"'+(bkSetup?' checked':'')+'> <span>Include my color and throw<small>Replace on the other phone also sets its color, light or dark, and the map throw.</small></span></label>'+
    '<div class="bkacts"><button type="button" onclick="bkCopy()">Copy</button>'+share+'</div>'+
    '<details class="bkmore" id="bkdet"><summary>Text code</summary><textarea id="bkout" class="bkcode" rows="3" readonly spellcheck="false" aria-label="Bag code"></textarea></details>'+
    '<label for="bk">Paste a code</label><textarea id="bk" class="bkcode" rows="3" spellcheck="false" autocapitalize="off" autocorrect="off" placeholder="Paste a bag code or an older backup"></textarea>'+
    '<video id="bkvid" class="bkvid" playsinline muted hidden></video>'+
    '<div id="bm" class="meta" style="margin-top:6px" aria-live="polite"></div>'+
    '<div class="bkacts"><button type="button" class="p" onclick="bkOpenPreview()">Preview</button><button type="button" id="bks" onclick="bkScan()">Scan a code</button></div>'+
    '<div class="bkacts"><button type="button" onclick="bkSaveFile()">Save file</button><button type="button" onclick="document.getElementById(\'bkfile\').click()">Open file</button></div>'+
    '<input id="bkfile" type="file" accept="application/json,.json,.txt,text/plain" hidden onchange="bkFile(this)">'+
    '<h3>On this phone</h3>'+bkHistHtml()+
    '<div class="bkacts"><button type="button" onclick="closeForm()">Close</button></div>';
  document.getElementById('modal').classList.add('show');
  document.getElementById('bkout').value=text;
  document.getElementById('bk').value=bkDraft;
}
function bkToggleSetup(){
  var box=document.getElementById('bk');
  if(box)bkDraft=box.value;
  var c=document.getElementById('bksetup');
  bkSetup=!!(c&&c.checked);
  bkHome();
}
function bkShowPreview(list,at,setup){
  bkStopCam();
  bkPending={discs:list,at:at||null,setup:setup||null};
  var when=bkWhen(at);
  document.getElementById('sheet').innerHTML=
    '<h2 style="margin:0 0 6px">This backup</h2>'+
    '<div class="meta">'+list.length+' disc'+(list.length===1?'':'s')+(when?' · '+esc(when):'')+'</div>'+
    bkNameList(list)+bkSetupLine(bkPending.setup)+
    '<div class="bkacts"><button type="button" class="p" onclick="bkAskReplace()">Replace this bag</button><button type="button" onclick="bkAdd()">Add missing discs</button></div>'+
    '<div class="bkacts"><button type="button" onclick="bkHome()">Back</button></div>';
  document.getElementById('modal').classList.add('show');
}
function bkAskReplace(){
  if(!bkPending)return;
  var n=bkPending.discs.length,cur=discs.length;
  document.getElementById('sheet').innerHTML=
    '<h2 style="margin:0 0 6px">Replace your bag?</h2>'+
    '<div class="meta">Your '+cur+' disc'+(cur===1?'':'s')+' will be replaced by these '+n+'. Discs only in the current bag will be removed.'+(bkPending.setup?' Your color and throw will change to match this backup.':'')+'</div>'+
    '<div class="bkacts"><button type="button" class="p" onclick="bkReplace()">Replace</button><button type="button" onclick="bkShowPreview(bkPending.discs,bkPending.at,bkPending.setup)">Back</button></div>';
}
function bkOpenPreview(text){
  var box=document.getElementById('bk');
  if(box)bkDraft=box.value;
  var raw=text!=null?text:bkDraft;
  try{var parsed=parseBag(raw);bkShowPreview(parsed.discs,parsed.at,parsed.setup)}
  catch(e){var m=document.getElementById('bm');if(m)m.textContent='That does not look like a bag backup.';else toast('That does not look like a bag backup.')}
}
function bkUseHist(i){
  var h=bkHist()[i];
  if(!h)return;
  try{var parsed=parseBag(h.bag);bkShowPreview(parsed.discs,h.t||parsed.at,parsed.setup)}
  catch(e){toast('That saved bag could not be read.')}
}
function bkReplace(){
  if(!bkPending)return;
  discs=bkPending.discs.map(bkCopyDisc);
  if(bkPending.setup)bkApplySetup(bkPending.setup);
  save();closeForm();render();
  toast(discs.length?('Restored '+discs.length+' disc'+(discs.length===1?'':'s')):'Bag cleared');
}
function bkAdd(){
  if(!bkPending)return;
  var seen={},added=0,updated=0;
  discs.forEach(function(d,i){seen[bkKey(d)]=i});
  bkPending.discs.forEach(function(r){
    var k=bkKey(r),at=seen[k];
    if(at==null){discs.push(bkCopyDisc(r,discs.length));seen[k]=discs.length-1;added++}
    else if(!bkSame(discs[at],r)){
      var cur=discs[at];
      cur.type=r.type;cur.plastic=r.plastic;cur.weight=r.weight;cur.color=r.color;cur.f=r.f.slice();cur.a=r.a.slice();cur.notes=r.notes;
      updated++;
    }
  });
  if(added||updated){save();render()}
  closeForm();
  var parts=[];
  if(added)parts.push('Added '+added+' disc'+(added===1?'':'s'));
  if(updated)parts.push('Updated '+updated+' disc'+(updated===1?'':'s'));
  toast(parts.length?parts.join(', '):'Nothing new to add.');
}
function bkShownCode(){var t=document.getElementById('bkout');return t&&t.value?t.value:bagText()}
function bkCopy(){
  var text=bkShownCode(),m=document.getElementById('bm');
  var fail=function(){
    var det=document.getElementById('bkdet');if(det)det.open=true;
    var t=document.getElementById('bkout');
    if(!t){if(m)m.textContent='Select the text code and copy it.';return}
    t.focus();t.select();
    var ok=false;try{ok=document.execCommand('copy')}catch(e){}
    if(m)m.textContent=ok?'Copied.':'Select the text code and copy it.';
  };
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(text).then(function(){if(m)m.textContent='Copied.'}).catch(fail);
  else fail();
}
function bkShare(){
  var text=bkShownCode();
  if(!navigator.share){bkCopy();return}
  navigator.share({title:'Flight Deck bag',text:text}).catch(function(e){if(!e||e.name!=='AbortError')bkCopy()});
}
function bkSaveFile(){
  var raw=bkShownCode(),pretty=raw;
  try{pretty=JSON.stringify(JSON.parse(raw),null,2)}catch(e){}
  var blob=new Blob([pretty],{type:'application/json'});
  var a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='flightdeck-bag.json';
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(function(){URL.revokeObjectURL(a.href)},1500);
  var m=document.getElementById('bm');if(m)m.textContent='Saved flightdeck-bag.json.';
}
function bkFile(input){
  var f=input.files&&input.files[0];
  input.value='';
  if(!f)return;
  var reader=new FileReader();
  reader.onload=function(){bkDraft=String(reader.result||'');bkOpenPreview(bkDraft)};
  reader.onerror=function(){var m=document.getElementById('bm');if(m)m.textContent='That file could not be read.'};
  reader.readAsText(f);
}
function bkScan(){
  var m=document.getElementById('bm');
  if(!window.BarcodeDetector||!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
    if(m)m.textContent='This browser cannot scan a code. Paste it instead.';
    return;
  }
  var det;
  try{det=new BarcodeDetector({formats:['qr_code']})}catch(e){if(m)m.textContent='This browser cannot scan a code. Paste it instead.';return}
  navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}}}).then(function(stream){
    bkScanToken++;
    var token=bkScanToken;
    if(bkCam){try{bkCam.getTracks().forEach(function(t){t.stop()})}catch(e){}}
    bkCam=stream;
    var v=document.getElementById('bkvid');
    if(!v){bkStopCam();return}
    v.hidden=false;
    v.srcObject=stream;
    v.play();
    if(m)m.textContent='Point the camera at the code.';
    var sb=document.getElementById('bks');
    if(sb){sb.textContent='Stop scanning';sb.onclick=function(){bkStopCam();if(m)m.textContent=''}}
    var tick=function(){
      if(token!==bkScanToken)return;
      det.detect(v).then(function(codes){
        if(token!==bkScanToken)return;
        if(codes&&codes[0]&&codes[0].rawValue){bkDraft=codes[0].rawValue;bkStopCam();bkOpenPreview(bkDraft);return}
        setTimeout(tick,280);
      }).catch(function(){if(token===bkScanToken)setTimeout(tick,400)});
    };
    setTimeout(tick,400);
  }).catch(function(){if(m)m.textContent='Camera permission is needed to scan. Paste the code instead.'});
}

document.addEventListener('keydown',function(e){if(e.key==='Escape'){if(mapFull)mapFullSet(false);closePalette();closeForm()}});
document.addEventListener('click',function(){closePalette()});
document.getElementById('modal').addEventListener('click',function(e){if(e.target===this)closeForm()});
function greet(){var h=new Date().getHours(),g=h<12?'Good morning':h<18?'Good afternoon':'Good evening';var e=document.getElementById('greet');if(e)e.textContent=g+(who?', '+who.split(' ')[0]:'')}
function openInfo(){
  document.getElementById('sheet').innerHTML='<div style="display:flex;justify-content:space-between;align-items:center"><h2 style="margin:0">About Flight Deck</h2><button class="sm p" onclick="closeForm()">Done</button></div>'+
  '<p style="margin-top:6px">Keep every disc in your bag in one place and record how each one really flies compared to its factory numbers.</p>'+
  '<h3>Reading the numbers</h3><p><b>Speed</b> is how hard it needs to be thrown. <b>Glide</b> is how long it stays up. <b>Turn</b> is how much it drifts right early on (more negative means more turn, for a right-hand backhand). <b>Fade</b> is how hard it hooks left at the end.</p>'+
  '<h3>Tuning a disc</h3><p>Tap a disc to open it, then tap Edit to set how it really flies. A beat-in or understable disc turns more and fades less. A beefy or overstable one turns less and fades more. The presets shift the numbers for you.</p>'+
  '<h3>Yours vs. factory</h3><p><b>Flight</b> and <b>Dial</b> above the list apply to every disc. Flight is a top-down path from the tee. Dial is stability: left is understable, right is overstable. Solid is yours and dashed is factory. Yours and Factory sit under each flight drawing and switch which numbers you see.</p>'+
  '<h3>Flight map</h3><p>The map draws the bag from above. The icons along the bottom set throwing hand, backhand or forehand, hyzer / flat / anhyzer, and slower / normal / faster arm speed. Colored dots show or hide each disc. The lines follow the same pattern as the DG Puttheads charts: high-speed turn first, fade at the finish, shorter and more overstable when the arm is slower, and a forehand that adds torque instead of only flipping the line. They are estimates from the flight numbers, for comparison. Nose angle, spin, wind, and wear are not measured.</p><h3>Catalog sources</h3><p>Published ratings are cross-checked against manufacturer material where available: <a href="https://www.innovadiscs.com/disc-golf-discs/disc-comparison/" target="_blank" rel="noopener">Innova</a>, <a href="https://mvpdiscsports.com/discs/" target="_blank" rel="noopener">MVP</a>, <a href="https://axiomdiscs.com/discs/" target="_blank" rel="noopener">Axiom</a>, <a href="https://www.discmania.net/collections" target="_blank" rel="noopener">Discmania</a>, <a href="https://support.discraft.com/support/solutions/articles/44001621475-what-are-these-numbers-on-my-disc-" target="_blank" rel="noopener">Discraft</a>, <a href="https://www.dynamicdiscs.com/collections/disc-golf-discs" target="_blank" rel="noopener">Dynamic Discs</a>, and <a href="https://prodigydisc.com/blogs/news/prodigy-disc-naming-system" target="_blank" rel="noopener">Prodigy</a>. Flight ratings are manufacturer estimates and are not fully standardized between brands; some listings may use an earlier or edition-specific rating.</p><h3>Adding discs</h3><p>Use the Catalog button for popular discs, or the + button for your own. Searching on the home screen also finds catalog discs.</p>'+
  '<h3>Saving</h3><p>Your bag saves on this device. Backup in the header shows a code another phone can scan or share, and it can save a file. A few earlier bags stay on this phone so you can restore one. Include my color and throw puts your color and map throw in the code, and Replace applies them. The color button next to light and dark mode changes the app color and stays on this device.</p>'+
  '<h3>Good to know</h3><p>Catalog numbers are approximate manufacturer ratings and can differ by source or plastic. Flight Deck is not affiliated with any disc manufacturer. Version 1.0.</p>';
  document.getElementById('modal').classList.add('show');
}
initTheme();
load();discs.forEach(function(d){delete d.photo});render();setAcct();updateMapMath();
